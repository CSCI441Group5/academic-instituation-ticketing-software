<!-- Base html file for application login entry -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Automated School Ticketing System</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/styles.css') }}"
        />
    </head>
    <body class="app-login-page">
        <main class="login-menu">
            <section aria-labelledby="login-header">
                <h1 id="login-header">Support Ticket Portal</h1>
                <p>
                    Sign in to submit requests, view ticket history, or manage
                    support queues.
                </p>

                <!-- Link users to the separate university login page -->
                <a href="{{ url_for('auth.university_login') }}" id="login-button">
                    Continue to Sign In
                </a>
            </section>
        </main>
    </body>
</html>
