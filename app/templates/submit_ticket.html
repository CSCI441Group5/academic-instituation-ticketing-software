<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Submit Ticket - Automated School Ticketing System</title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/styles.css') }}"
        />
    </head>

    <body>
        <!-- Shared top navigation, menu drawer, and notification bell -->
        {% include "_top_nav.html" %}

        <div class="page-container">
            <h1>Submit Ticket</h1>

            {% if success %}
            <p>Ticket created successfully (ID: {{ ticket_id }}).</p>
            {% endif %} {% if error %}
            <p>{{ error }}</p>
            {% endif %}

            <!-- Form -->
            <form
                action="{{ url_for('auth.new_ticket') }}"
                method="POST"
                enctype="multipart/form-data"
            >
                <label for="title">Title:</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Brief summary of the issue"
                    required
                />
                <br /><br />

                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="IT">IT</option>
                    <option value="Facilities">Facilities</option>
                    <option value="Academic Support">Academic Support</option>
                </select>
                <br /><br />

                <label for="description">Description:</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    required
                ></textarea>
                <br /><br />

                <label for="attachment">Attachment (optional):</label>
                <input type="file" id="attachment" name="attachment" />
                <br /><br />

                <button type="submit">Create Ticket</button>
            </form>

            <p>
                <a href="{{ url_for('auth.dashboard') }}">
                    <button type="button">Back to Dashboard</button>
                </a>
            </p>
        </div>
        <script src="{{url_for('static', filename='js/theme.js')}}"></script>
    </body>
</html>
